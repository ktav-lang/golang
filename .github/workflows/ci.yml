name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # Build native library + run Go tests in one job per OS. The test
  # suite hardcodes both paths (cabi at `target/release/...`, spec at
  # `spec/versions/0.8/tests`) — no env wiring needed.
  # ------------------------------------------------------------------
  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest moved to macOS 26 in 2026. Go 1.21-1.23 test
        # binaries abort there with a missing LC_UUID load command;
        # macos-15 remains the compatible runner until those toolchains
        # gain the macOS 26 linker fix.
        os: [ubuntu-latest, macos-15, windows-latest]
        go: ["1.21", "1.22", "1.23"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pin spec submodule to 0.8.1
        run: |
          git -C spec fetch --depth 1 origin 388982118c0d8f767bf283356ac9c9bb50fdc3f5
          git -C spec checkout --detach 388982118c0d8f767bf283356ac9c9bb50fdc3f5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      # Provenance: prove the RESOLVED core is the published Rust
      # ktav 0.8.1. Order matters: resolve the lock FIRST (Cargo.lock is
      # gitignored in this repo), VERIFY it against the published
      # artifact, then build --locked so compilation is proven to use
      # exactly the verified resolution. Cargo.lock is parsed with an
      # awk state machine over [[package]] blocks (version AND checksum
      # AND source of the ktav entry); the crates.io sparse index is
      # JSONL (one object per line with `vers` and `cksum`) — jq selects
      # the 0.8.1 line's cksum. All three values must agree or the job
      # fails.
      - name: Resolve and verify ktav core version and checksum
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          want_ver="0.8.1"
          want_cksum="7140dfe2fa6c320e74768cd6a637828c2d26f81746254f4fcd805f3993bd3fd5"
          lock_ver="$(awk -F'"' '
            /^[[:space:]]*\[\[package\]\]/ { inktav=0 }
            /^[[:space:]]*name = "ktav"$/ { inktav=1 }
            inktav && /^[[:space:]]*version = / { print $2; exit }
          ' Cargo.lock)"
          lock_cksum="$(awk -F'"' '
            /^[[:space:]]*\[\[package\]\]/ { inktav=0 }
            /^[[:space:]]*name = "ktav"$/ { inktav=1 }
            inktav && /^[[:space:]]*checksum = / { print $2; exit }
          ' Cargo.lock)"
          lock_src="$(awk -F'"' '
            /^[[:space:]]*\[\[package\]\]/ { inktav=0 }
            /^[[:space:]]*name = "ktav"$/ { inktav=1 }
            inktav && /^[[:space:]]*source = / { print $2; exit }
          ' Cargo.lock)"
          echo "Cargo.lock resolves ktav ${lock_ver} cksum ${lock_cksum} src ${lock_src}"
          test "$lock_ver" = "$want_ver" || { echo "lock version mismatch"; exit 1; }
          test "$lock_cksum" = "$want_cksum" || { echo "lock checksum mismatch"; exit 1; }
          case "$lock_src" in
            registry+https://github.com/rust-lang/crates.io-index*) ;;
            *) echo "lock source is not the crates.io registry: $lock_src"; exit 1 ;;
          esac
          got="$(curl -fsSL https://index.crates.io/kt/av/ktav | jq -r 'select(.vers=="0.8.1") | .cksum' | head -n1)"
          test -n "$got" || { echo "sparse index has no ktav 0.8.1 line"; exit 1; }
          echo "crates.io cksum = ${got}"
          test "$got" = "$want_cksum" || { echo "checksum mismatch: ktav 0.8.1 provenance unproven"; exit 1; }

      - name: Build native library (locked to the verified lockfile)
        run: cargo build --release --locked -p ktav-cabi

      - name: Go tests
        run: go test -v ./...

  # ------------------------------------------------------------------
  # Native DEBUG build: release-mode Rust optimizations can hide the
  # `slice::from_raw_parts` non-null precondition violation that a
  # zero-length input triggers (len 0 with a null pointer is UB that
  # debug assertions catch, but release silently accepts). This job
  # builds the cabi WITHOUT --release and runs the empty-source
  # regression so reverting the fixed `emptyInputByte` anchor fails
  # here.
  # ------------------------------------------------------------------
  test-native-debug:
    name: native debug build / empty-source ABI regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pin spec submodule to 0.8.1
        run: |
          git -C spec fetch --depth 1 origin 388982118c0d8f767bf283356ac9c9bb50fdc3f5
          git -C spec checkout --detach 388982118c0d8f767bf283356ac9c9bb50fdc3f5

      - uses: dtolnay/rust-toolchain@stable
      # Distinct cache key: debug artifacts must not collide with the
      # release-mode cache used by the test matrix above.
      - uses: Swatinem/rust-cache@v2
        with:
          key: debug

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # No --release: the debug build keeps the precondition checks that
      # release mode can optimize away.
      - name: Build native library (debug)
        run: cargo build -p ktav-cabi

      # main_test.go honours $KTAV_LIB_PATH, overriding the default
      # target/release/<cabi> probe path.
      - name: Empty-source ABI regression (native debug)
        env:
          KTAV_LIB_PATH: ${{ github.workspace }}/target/debug/libktav_cabi.so
        run: go test -count=1 -run '^TestEmptySourceAcrossNativeOperations$' ./...

  # ------------------------------------------------------------------
  # Pure-Go backend: Go only, NO rust toolchain and NO cabi artifact.
  # KTAV_FORCE_PURE=1 makes TestMain default every test to the pure
  # backend; requireCabi-gated tests FAIL here (never skip) — the
  # native matrix above covers them. Every TestPure*/corpus-guard/
  # error-contract/README test must run against the real 0.8 corpus
  # with zero native loading (TestPureCorpusNeverLoadsNative and
  # TestPureNeverLoadsNativeLibrary guard that).
  # ------------------------------------------------------------------
  test-pure:
    name: pure backend / no native library
    runs-on: ubuntu-latest
    env:
      KTAV_FORCE_PURE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pin spec submodule to 0.8.1
        run: |
          git -C spec fetch --depth 1 origin 388982118c0d8f767bf283356ac9c9bb50fdc3f5
          git -C spec checkout --detach 388982118c0d8f767bf283356ac9c9bb50fdc3f5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Go tests (pure backend, no cabi built)
        run: go test -v -run '^(TestPure|TestProbe|TestBridge|TestCorpusManifest|TestLoadCorpusManifest|TestReadFixtureSource|TestWriter|TestDumpsForceStringsPreservesNonFiniteFloatText|TestInvalidUTF8|TestLineOfOffset|TestFirstInvalidUTF8|TestReadme)' ./...

      - name: Engine and pure package tests (all engine tests)
        run: go test -v ./internal/engine ./pure

  # ------------------------------------------------------------------
  # Packaged pure consumer: a GENUINE distribution representation. The
  # job builds a file-based Go module proxy from the checkout (serving
  # only this module path; no third-party or public fallback), then runs
  # an isolated readonly consumer module with no native artifact.
  # Cleanup stays in the runner temp dir; no repo files are touched.
  # ------------------------------------------------------------------
  test-packaged-pure:
    name: packaged pure consumer / module proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pin spec submodule to 0.8.1
        run: |
          git -C spec fetch --depth 1 origin 388982118c0d8f767bf283356ac9c9bb50fdc3f5
          git -C spec checkout --detach 388982118c0d8f767bf283356ac9c9bb50fdc3f5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run pure consumer installed through a file:// module proxy
        run: |
          set -euo pipefail
          export CGO_ENABLED=0
          work="$(mktemp -d "${RUNNER_TEMP:-/tmp}/ktav-consumer.XXXXXX")"
          # The hosted runner discards this isolated directory after the job.
          # The private module must NOT be resolvable from any warmed
          # runner cache: isolate the module and build caches, and
          # assert the native artifact is genuinely absent.
          export GOMODCACHE="$work/gomod"
          export GOCACHE="$work/gocache"
          mkdir -p "$GOMODCACHE" "$GOCACHE"
          test -z "$(find "$GOMODCACHE" -mindepth 1 -print -quit)"
          test -z "$(find "$GOCACHE" -mindepth 1 -print -quit)"
          shopt -s nullglob
          cabi=(target/release/*ktav_cabi* target/release/libktav_cabi* target/release/ktav_cabi*)
          shopt -u nullglob
          test "${#cabi[@]}" -eq 0 || { echo "native artifact present: ${cabi[*]}"; exit 1; }
          python3 scripts/module_proxy.py "$GITHUB_WORKSPACE" v0.8.1 "$work/proxy"
          # Copy the WHOLE consumer main package, not just main.go.
          mkdir -p "$work/consumer"
          cp internal/pureconsumer/*.go "$work/consumer/"
          cd "$work"
          # Trap the rust toolchain on PATH: the shims append to a marker
          # file and exit 127. Real tools are never modified or removed;
          # we only prepend. After the run the marker must not exist — a
          # pure consumer must never invoke rustc/cargo.
          mkdir -p "$work/fakebin"
          for tool in rustc cargo; do
            printf '%s\n' \
              '#!/bin/sh' \
              "mkdir -p \"$work\"" \
              "echo \"$tool invoked: \$*\" >> \"$work/rust-invoked.marker\"" \
              'exit 127' > "$work/fakebin/$tool"
            chmod +x "$work/fakebin/$tool"
          done
          export PATH="$work/fakebin:$PATH"
          # The file proxy serves ONLY this module. It never proxies its
          # declared native dependencies or falls back to the public proxy.
          export GOPROXY="file://$work/proxy"
          export GOSUMDB=off
          export GOFLAGS=-mod=readonly
          export GOTOOLCHAIN=local
          export GOWORK=off
          # The consumer module root is $work; consumer/ is its main package.
          go mod init example.com/ktav-pure-consumer
          printf 'require github.com/ktav-lang/golang v0.8.1\n' >> go.mod
          # Seed only this module and its checksum; GOFLAGS remains readonly.
          go mod download github.com/ktav-lang/golang@v0.8.1
          imports="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./consumer)"
          printf '%s\n' "$imports"
          printf '%s\n' "$imports" | awk 'NF && $0 !~ /^(example\.com\/ktav-pure-consumer|example\.com\/ktav-pure-consumer\/consumer|github\.com\/ktav-lang\/golang\/pure|github\.com\/ktav-lang\/golang\/internal\/engine)$/ { print "unexpected dependency: " $0 > "/dev/stderr"; bad=1 } END { exit bad }'
          for required in github.com/ktav-lang/golang/pure github.com/ktav-lang/golang/internal/engine; do
            printf '%s\n' "$imports" | grep -Fxq "$required" || { echo "missing expected dependency: $required"; exit 1; }
          done
          test ! -d target/debug && test ! -d target/release
          go run ./consumer --spec "$GITHUB_WORKSPACE/spec/versions/0.8/tests"
          test ! -e "$work/rust-invoked.marker" || { echo "rust toolchain was invoked during pure consumer run"; cat "$work/rust-invoked.marker"; exit 1; }

  lint-rust:
    name: rust clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --release -p ktav-cabi -- -D warnings

  lint-go:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      # unsafeptr=false: we legitimately convert C-owned pointers from
      # purego.SyscallN out-params to Go slices. The memory is Rust-
      # managed and not GC-tracked, so the analyzer's warning is a
      # false positive.
      - run: go vet -unsafeptr=false ./...
      - run: test -z "$(gofmt -l .)"

  # ------------------------------------------------------------------
  # The published Markdown documents are generated by
  # @ktav-lang/polydoc from the root-docs/ unit trees. This job fails
  # when a committed artifact drifts from its source — which is what a
  # hand-edit of the artifact looks like. Fix the source and re-run the
  # generator; never patch the artifact.
  # ------------------------------------------------------------------
  docs:
    name: Docs (generated markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Generated docs are byte-identical to their source units
        run: node scripts/build-docs.mjs --check
