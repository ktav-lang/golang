name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # Build native library + run Go tests in one job per OS. The test
  # suite hardcodes both paths (cabi at `target/release/...`, spec at
  # `spec/versions/0.8/tests`) — no env wiring needed.
  # ------------------------------------------------------------------
  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest moved to macOS 26 in 2026. Go 1.21-1.23 test
        # binaries abort there with a missing LC_UUID load command;
        # macos-15 remains the compatible runner until those toolchains
        # gain the macOS 26 linker fix.
        os: [ubuntu-latest, macos-15, windows-latest]
        go: ["1.21", "1.22", "1.23"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pin spec submodule to 0.8.1
        run: |
          git -C spec fetch --depth 1 origin 388982118c0d8f767bf283356ac9c9bb50fdc3f5
          git -C spec checkout --detach 388982118c0d8f767bf283356ac9c9bb50fdc3f5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      # Provenance: prove the RESOLVED core is the published Rust
      # ktav 0.8.1. Order matters: resolve the lock FIRST (Cargo.lock is
      # gitignored in this repo), VERIFY it against the published
      # artifact, then build --locked so compilation is proven to use
      # exactly the verified resolution. Cargo.lock is parsed with an
      # awk state machine over [[package]] blocks (version AND checksum
      # AND source of the ktav entry); the crates.io sparse index is
      # JSONL (one object per line with `vers` and `cksum`) — jq selects
      # the 0.8.1 line's cksum. All three values must agree or the job
      # fails.
      - name: Resolve and verify ktav core version and checksum
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          want_ver="0.8.1"
          want_cksum="7140dfe2fa6c320e74768cd6a637828c2d26f81746254f4fcd805f3993bd3fd5"
          lock_ver="$(awk -F'"' '
            /^[[:space:]]*\[\[package\]\]/ { inktav=0 }
            /^[[:space:]]*name = "ktav"$/ { inktav=1 }
            inktav && /^[[:space:]]*version = / { print $2; exit }
          ' Cargo.lock)"
          lock_cksum="$(awk -F'"' '
            /^[[:space:]]*\[\[package\]\]/ { inktav=0 }
            /^[[:space:]]*name = "ktav"$/ { inktav=1 }
            inktav && /^[[:space:]]*checksum = / { print $2; exit }
          ' Cargo.lock)"
          lock_src="$(awk -F'"' '
            /^[[:space:]]*\[\[package\]\]/ { inktav=0 }
            /^[[:space:]]*name = "ktav"$/ { inktav=1 }
            inktav && /^[[:space:]]*source = / { print $2; exit }
          ' Cargo.lock)"
          echo "Cargo.lock resolves ktav ${lock_ver} cksum ${lock_cksum} src ${lock_src}"
          test "$lock_ver" = "$want_ver" || { echo "lock version mismatch"; exit 1; }
          test "$lock_cksum" = "$want_cksum" || { echo "lock checksum mismatch"; exit 1; }
          case "$lock_src" in
            registry+https://github.com/rust-lang/crates.io-index*) ;;
            *) echo "lock source is not the crates.io registry: $lock_src"; exit 1 ;;
          esac
          got="$(curl -fsSL https://index.crates.io/kt/av/ktav | jq -r 'select(.vers=="0.8.1") | .cksum' | head -n1)"
          test -n "$got" || { echo "sparse index has no ktav 0.8.1 line"; exit 1; }
          echo "crates.io cksum = ${got}"
          test "$got" = "$want_cksum" || { echo "checksum mismatch: ktav 0.8.1 provenance unproven"; exit 1; }

      - name: Build native library (locked to the verified lockfile)
        run: cargo build --release --locked -p ktav-cabi

      - name: Go tests
        run: go test -v ./...

  # ------------------------------------------------------------------
  # Pure-Go backend: Go only, NO rust toolchain and NO cabi artifact.
  # KTAV_FORCE_PURE=1 makes TestMain default every test to the pure
  # backend; requireCabi-gated tests FAIL here (never skip) — the
  # native matrix above covers them. Every TestPure*/corpus-guard/
  # error-contract/README test must run against the real 0.8 corpus
  # with zero native loading (TestPureCorpusNeverLoadsNative and
  # TestPureNeverLoadsNativeLibrary guard that).
  # ------------------------------------------------------------------
  test-pure:
    name: pure backend / no native library
    runs-on: ubuntu-latest
    env:
      KTAV_FORCE_PURE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pin spec submodule to 0.8.1
        run: |
          git -C spec fetch --depth 1 origin 388982118c0d8f767bf283356ac9c9bb50fdc3f5
          git -C spec checkout --detach 388982118c0d8f767bf283356ac9c9bb50fdc3f5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Go tests (pure backend, no cabi built)
        run: go test -v -run '^(TestPure|TestProbe|TestBridge|TestCorpusManifest|TestLoadCorpusManifest|TestReadFixtureSource|TestWriter|TestDumpsForceStringsPreservesNonFiniteFloatText|TestInvalidUTF8|TestLineOfOffset|TestFirstInvalidUTF8|TestReadme)' ./...

  # ------------------------------------------------------------------
  # Packaged pure consumer: a GENUINE distribution representation. The
  # job builds a file-based Go module proxy from the checkout
  # (scripts/module_proxy.py: @v/list + v0.8.1.info/.mod/.zip, zip paths
  # `github.com/ktav-lang/golang@v0.8.1/...` per `go help module-proxy`),
  # then installs the module THROUGH that proxy (GOPROXY=file://…,
  # GOSUMDB=off, GOFLAGS=-mod=mod) into an independent temp module and
  # runs internal/pureconsumer/main.go — UsePure plus every public
  # operation, with NO native artifact and NO checkout -replace.
  # Cleanup stays in the runner temp dir; no repo files are touched.
  # ------------------------------------------------------------------
  test-packaged-pure:
    name: packaged pure consumer / module proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pin spec submodule to 0.8.1
        run: |
          git -C spec fetch --depth 1 origin 388982118c0d8f767bf283356ac9c9bb50fdc3f5
          git -C spec checkout --detach 388982118c0d8f767bf283356ac9c9bb50fdc3f5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run pure consumer installed through a file:// module proxy
        run: |
          set -euo pipefail
          work="$(mktemp -d "${RUNNER_TEMP:-/tmp}/ktav-consumer.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          # The private module must NOT be resolvable from any warmed
          # runner cache: isolate the module and build caches, and
          # assert the native artifact is genuinely absent.
          export GOMODCACHE="$work/gomod"
          export GOCACHE="$work/gocache"
          shopt -s nullglob
          cabi=(target/release/*ktav_cabi* target/release/libktav_cabi* target/release/ktav_cabi*)
          shopt -u nullglob
          test "${#cabi[@]}" -eq 0 || { echo "native artifact present: ${cabi[*]}"; exit 1; }
          python3 scripts/module_proxy.py "$GITHUB_WORKSPACE" v0.8.1 "$work/proxy"
          cp internal/pureconsumer/main.go "$work/main.go"
          cd "$work"
          # The file proxy serves ONLY github.com/ktav-lang/golang; the
          # public deps (purego, x/sys) resolve from proxy.golang.org.
          export GOPROXY="file://$work/proxy,https://proxy.golang.org"
          # GOSUMDB=off: the private module's zip cannot carry a sum in
          # sum.golang.org, and a file proxy has no signed database —
          # disabling sum verification for this consumer proof is the
          # accepted tradeoff (documented in scripts/module_proxy.py).
          export GOSUMDB=off
          export GOFLAGS=-mod=mod
          go mod init example.com/ktav-pure-consumer
          go get github.com/ktav-lang/golang@v0.8.1
          go run .

  lint-rust:
    name: rust clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --release -p ktav-cabi -- -D warnings

  lint-go:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      # unsafeptr=false: we legitimately convert C-owned pointers from
      # purego.SyscallN out-params to Go slices. The memory is Rust-
      # managed and not GC-tracked, so the analyzer's warning is a
      # false positive.
      - run: go vet -unsafeptr=false ./...
      - run: test -z "$(gofmt -l .)"

  # ------------------------------------------------------------------
  # The published Markdown documents are generated by
  # @ktav-lang/polydoc from the root-docs/ unit trees. This job fails
  # when a committed artifact drifts from its source — which is what a
  # hand-edit of the artifact looks like. Fix the source and re-run the
  # generator; never patch the artifact.
  # ------------------------------------------------------------------
  docs:
    name: Docs (generated markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Generated docs are byte-identical to their source units
        run: node scripts/build-docs.mjs --check
