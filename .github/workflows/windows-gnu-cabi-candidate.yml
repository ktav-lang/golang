name: Go Windows GNU LLVM candidate evidence

on:
  workflow_call:
    inputs:
      source-ref:
        description: Exact reviewed original Go 0.8.1 source
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REF: ${{ inputs.source-ref || 'dd7a14cc1c88199b5515f5c891100dd72ef211fd' }}

jobs:
  cabi-gnullvm:
    name: Go GNU C ABI / ${{ matrix.target }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnullvm
            compiler: x86_64-w64-mingw32-clang.exe
            machine: 34404
          - target: aarch64-pc-windows-gnullvm
            compiler: aarch64-w64-mingw32-clang.exe
            machine: 43620
    env:
      CABI_TARGET: ${{ matrix.target }}
      CABI_COMPILER: ${{ matrix.compiler }}
      CABI_MACHINE: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@v4
      - name: Preserve reviewed Go notice tooling and lock
        shell: python
        run: |
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path
          stage = Path(os.environ['RUNNER_TEMP']) / 'cabi-gnullvm-tools'
          stage.mkdir()
          profile = Path('ci/rust-compiler-notices.json').read_bytes()
          if hashlib.sha256(profile).hexdigest() != '39cbf18420d5e0c0a35fb2d5e5fbed4db755488ea0ca11414944ead9fbabab92':
              raise SystemExit('compiler profile differs')
          files = ['crates/cabi/build.rs', 'scripts/prepare_cabi_notices.py', 'scripts/cargo_notice_bundle.py', 'scripts/collect_cargo_notices.py', 'scripts/check_embedded_notices.py', 'ci/about.toml', 'ci/test_embedded_notices.py', 'scripts/rust_compiler_notices.py', 'ci/rust-compiler-notices.json', 'ci/test_rust_compiler_notices.py', 'scripts/cabi_gnullvm_notices.py', 'ci/licenses/cabi-gnullvm-runtime.json', 'ci/test_cabi_gnullvm_notices.py', 'ci/go-windows-gnu.lock']
          files.extend(item['path'] for item in json.loads(profile)['materials'])
          for name in files:
              destination = stage / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(name, destination)
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          submodules: recursive
          persist-credentials: false
      - name: Bind original Go source and reviewed lock
        shell: python
        run: |
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != os.environ['SOURCE_REF']:
              raise SystemExit('unexpected Go candidate source')
          source = Path('crates/cabi/src/lib.rs')
          original = source.read_bytes()
          if hashlib.sha256(original).hexdigest() != 'efbffeab0c64f41c96b4695814b158d37c64a3d667e1abcbfa1da2bc4ee060ca':
              raise SystemExit('original Go C ABI source differs')
          stage = Path(os.environ['RUNNER_TEMP']) / 'cabi-gnullvm-tools'
          overlay = ['crates/cabi/build.rs', 'crates/cabi/src/lib.rs']
          baseline = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() if Path(name).is_file() else None for name in overlay}
          for path in stage.rglob('*'):
              if path.is_file():
                  destination = Path(path.relative_to(stage))
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  if destination.as_posix() == 'crates/cabi/build.rs' and destination.exists() and destination.read_bytes() != path.read_bytes():
                      raise SystemExit('existing Go build hook requires review')
                  shutil.copyfile(path, destination)
          hook = b'include!(concat!(env!("OUT_DIR"), "/native_notices.rs"));'
          if hook in original:
              raise SystemExit('unexpected original notice overlay')
          source.write_bytes(original + bytes([10, 10]) + hook + bytes([10]))
          protected = ['Cargo.toml', 'crates', 'go.mod', 'go.sum', '*.go', 'internal', 'pure', 'tests', 'root-docs']
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', '--', *protected], text=True).splitlines())
          changed.update(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '--', *protected], text=True).splitlines())
          if changed != set(overlay):
              raise SystemExit('Go candidate changed protected source beyond notice metadata')
          lock = Path('ci/go-windows-gnu.lock').read_bytes()
          if hashlib.sha256(lock).hexdigest() != 'a7066ecc92727ae12c3905cbf1a2b73266da609773356f725e931682381b7a8b':
              raise SystemExit('reviewed Go lock differs')
          Path('Cargo.lock').write_bytes(lock)
          record = {name: {'baseline_sha256': baseline[name], 'compiled_sha256': hashlib.sha256(Path(name).read_bytes()).hexdigest()} for name in overlay}
          (Path(os.environ['RUNNER_TEMP']) / 'cabi-gnullvm-source-overlay.json').write_text(json.dumps(record, sort_keys=True, indent=2) + '\n', encoding='utf-8')
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
          components: rust-docs
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - name: Verify Go notice and SDK input guards
        shell: python
        run: |
          import subprocess
          import sys
          for pattern in ['test_embedded_notices.py', 'test_rust_compiler_notices.py', 'test_cabi_gnullvm_notices.py']:
              subprocess.run([sys.executable, '-I', '-m', 'unittest', 'discover', '-s', 'ci', '-p', pattern, '-v'], check=True)
      - name: Prepare locked Go Cargo compiler and runtime grants
        shell: python
        run: |
          import json
          import os
          import shutil
          import subprocess
          import sys
          import tomllib
          from pathlib import Path
          core = [item for item in tomllib.loads(Path('Cargo.lock').read_text())['package'] if item['name'] == 'ktav']
          if len(core) != 1 or core[0]['version'] != '0.8.1' or core[0]['checksum'] != '7140dfe2fa6c320e74768cd6a637828c2d26f81746254f4fcd805f3993bd3fd5':
              raise SystemExit('original registry core identity differs')
          evidence = Path(os.environ['RUNNER_TEMP']) / 'cabi-gnullvm-evidence'
          subprocess.run([sys.executable, 'scripts/prepare_cabi_notices.py', str(evidence)], check=True)
          for name in ['LICENSE-MIT', 'LICENSE-APACHE']:
              shutil.copyfile(name, evidence / name)
          profile = json.loads(Path('ci/rust-compiler-notices.json').read_bytes())
          for name in ['ci/rust-compiler-notices.json', *[item['path'] for item in profile['materials']]]:
              destination = evidence / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(name, destination)
          subprocess.run([sys.executable, '-I', 'scripts/cabi_gnullvm_notices.py', 'prepare', str(evidence), os.environ['CABI_TARGET']], check=True)
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as destination:
              destination.write('KTAV_NATIVE_NOTICES=' + str(evidence / 'NOTICE.json.gz') + '\n')
      - name: Install the exact previously reviewed LLVM MinGW SDK
        shell: python
        run: |
          import hashlib
          import json
          import os
          import stat
          import subprocess
          import urllib.request
          import zipfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ['RUNNER_TEMP'])
          sdk = root / 'cabi-gnullvm-sdk'
          sdk.mkdir()
          archive_path = sdk / 'sdk.zip'
          url = 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip'
          checksum = hashlib.sha256()
          total = 0
          with urllib.request.urlopen(url, timeout=120) as response, archive_path.open('xb') as output:
              while chunk := response.read(1024 * 1024):
                  total += len(chunk)
                  if total > 256 * 1024 * 1024:
                      raise SystemExit('candidate SDK size bound exceeded')
                  checksum.update(chunk)
                  output.write(chunk)
          if checksum.hexdigest() != 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd':
              raise SystemExit('candidate SDK differs from reviewed archive')
          with zipfile.ZipFile(archive_path) as archive:
              seen = set()
              for item in archive.infolist():
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or '\\' in item.filename or ':' in item.filename or item.filename.casefold() in seen or stat.S_IFMT(item.external_attr >> 16) == stat.S_IFLNK:
                      raise SystemExit('unsafe or duplicate candidate SDK path')
                  seen.add(item.filename.casefold())
              archive.extractall(sdk)
          install = sdk / 'llvm-mingw-20261020-ucrt-x86_64'
          compiler = install / 'bin' / os.environ['CABI_COMPILER']
          if not compiler.is_file():
              raise SystemExit('candidate compiler missing')
          evidence = root / 'cabi-gnullvm-evidence'
          (evidence / 'compiler-version.txt').write_bytes(subprocess.check_output([str(compiler), '--version']))
          record = {'source_ref': os.environ['SOURCE_REF'], 'tooling_ref': os.environ['GITHUB_SHA'], 'target': os.environ['CABI_TARGET'], 'sdk_archive_sha256': checksum.hexdigest(), 'sdk_source': url, 'notice_overlay': json.loads((root / 'cabi-gnullvm-source-overlay.json').read_text(encoding='utf-8')), 'coverage': 'Original Go 0.8.1 C ABI GNU candidate; separate host-language consumers required before production integration. No historical asset clearance.'}
          (evidence / 'source-provenance.json').write_text(json.dumps(record, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          key = 'CARGO_TARGET_' + os.environ['CABI_TARGET'].upper().replace('-', '_') + '_LINKER'
          flags = ['-C', 'target-feature=+crt-static', '-C', 'link-arg=-Wl,-Map,' + (evidence / 'native-link.map').as_posix(), '-C', 'link-arg=-Wl,--reproduce=' + (root / 'cabi-gnullvm-link.tar').as_posix()]
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as output:
              for name, value in [(key, str(compiler)), ('CARGO_ENCODED_RUSTFLAGS', chr(31).join(flags)), ('LLVM_MINGW_CANDIDATE', str(install))]:
                  output.write(name + '=' + value + '\n')
          with Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8') as output:
              output.write(str(install / 'bin') + '\n')
      - name: Build original C ABI APIs with the reviewed notice resource
        run: cargo build --locked --release -p ktav-cabi --target ${{ matrix.target }}
      - name: Capture exact PE, link inputs and original SDK legal documents
        shell: python
        run: |
          import base64
          import hashlib
          import json
          import os
          import re
          import shutil
          import struct
          import subprocess
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ['RUNNER_TEMP'])
          evidence = root / 'cabi-gnullvm-evidence'
          original = Path('target') / os.environ['CABI_TARGET'] / 'release/ktav_cabi.dll'
          binary = evidence / 'ktav_cabi.dll'
          shutil.copyfile(original, binary)
          data = binary.read_bytes()
          if len(data) < 64 or len(data) > 128 * 1024 * 1024 or data[:2] != b'MZ':
              raise SystemExit('expected bounded PE library')
          offset = int.from_bytes(data[60:64], 'little')
          if offset + 24 > len(data) or data[offset:offset + 4] != b'PE\0\0' or struct.unpack_from('<H', data, offset + 4)[0] != int(os.environ['CABI_MACHINE']) or not struct.unpack_from('<H', data, offset + 22)[0] & 0x2000:
              raise SystemExit('PE CPU or DLL kind differs from target')
          sdk = Path(os.environ['LLVM_MINGW_CANDIDATE'])
          pe = subprocess.check_output([str(sdk / 'bin/llvm-readobj.exe'), '--file-headers', '--coff-imports', '--coff-exports', str(binary)])
          (evidence / 'pe-inputs.txt').write_bytes(pe)
          imports = [name.decode('ascii').lower() for name in re.findall(rb'^\s*Name: ([^\r\n]+[.]dll)\s*$', pe, re.M | re.I)]
          # https://learn.microsoft.com/en-us/windows/win32/seccng/processprng
          allowed = {'kernel32.dll', 'ntdll.dll', 'ucrtbase.dll', 'msvcrt.dll', 'advapi32.dll', 'bcrypt.dll', 'bcryptprimitives.dll', 'crypt32.dll', 'dbghelp.dll', 'ole32.dll', 'oleaut32.dll', 'rpcrt4.dll', 'secur32.dll', 'shell32.dll', 'shlwapi.dll', 'user32.dll', 'userenv.dll', 'version.dll', 'ws2_32.dll', 'psapi.dll'}
          def os_import(name):
              return name in allowed or name.startswith(('api-ms-win-', 'ext-ms-win-'))
          assert os_import('bcryptprimitives.dll')
          for name in ['libunwind.dll', 'libgcc_s_seh-1.dll', 'libstdc++-6.dll', 'vcruntime140.dll', 'foreign.dll']:
              assert not os_import(name), name
          if not imports or not all(os_import(name) for name in imports):
              raise SystemExit('C ABI candidate imports a non-OS runtime DLL: ' + repr(imports))
          exports = re.findall(rb'^\s*Name: (ktav_[^\r\n]+)\s*$', pe, re.M)
          expected_exports = {b'ktav_loads', b'ktav_loads_strict', b'ktav_dumps', b'ktav_dumps_force_strings', b'ktav_emit_canonical', b'ktav_format', b'ktav_canonical_from_source', b'ktav_free', b'ktav_version', b'ktav_abi_version'}
          if len(exports) != 10 or set(exports) != expected_exports:
              raise SystemExit('original callable C ABI export set differs')
          if len(re.findall(rb'^\s*Name: KTAV_THIRD_PARTY_NOTICES\s*$', pe, re.M)) != 1:
              raise SystemExit('C ABI notice static export missing')
          link_map = evidence / 'native-link.map'
          if not link_map.is_file() or not 0 < link_map.stat().st_size <= 32 * 1024 * 1024:
              raise SystemExit('missing or oversized actual C ABI map')
          reproduction = root / 'cabi-gnullvm-link.tar'
          if not reproduction.is_file() or reproduction.stat().st_size > 512 * 1024 * 1024:
              raise SystemExit('missing or oversized linker reproduction')
          inputs = []
          seen = set()
          total = 0
          with tarfile.open(reproduction, mode='r:') as archive:
              for item in archive:
                  path = PurePosixPath(item.name)
                  if path.is_absolute() or '..' in path.parts or '\\' in item.name or item.name in seen or item.issym() or item.islnk():
                      raise SystemExit('unsafe linker input record')
                  seen.add(item.name)
                  if item.isdir():
                      continue
                  if not item.isfile() or item.size > 128 * 1024 * 1024:
                      raise SystemExit('invalid linker input type/size')
                  total += item.size
                  if total > 512 * 1024 * 1024 or len(seen) > 8192:
                      raise SystemExit('link input inventory exceeds bound')
                  source = archive.extractfile(item)
                  checksum = hashlib.sha256()
                  size = 0
                  while chunk := source.read(1024 * 1024):
                      checksum.update(chunk)
                      size += len(chunk)
                  if size != item.size:
                      raise SystemExit('truncated linker input')
                  inputs.append({'path': item.name, 'bytes': size, 'sha256': checksum.hexdigest()})
          if not any(item['path'].endswith('/response.txt') for item in inputs):
              raise SystemExit('missing actual linker command evidence')
          (evidence / 'link-input-fingerprints.json').write_text(json.dumps(inputs, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          legal = []
          total = 0
          for path in sorted(sdk.rglob('*')):
              if not path.is_file() or not re.match(r'(?i)^(?:license|copying|copyright|notice|authors|disclaimer)', path.name):
                  continue
              if path.stat().st_size > 4 * 1024 * 1024:
                  raise SystemExit('SDK legal document exceeds bound')
              data = path.read_bytes()
              total += len(data)
              if total > 32 * 1024 * 1024:
                  raise SystemExit('SDK legal inventory exceeds bound')
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError:
                  text = None
              legal.append({'path': path.relative_to(sdk).as_posix(), 'sha256': hashlib.sha256(data).hexdigest(), 'raw_bytes_base64': base64.b64encode(data).decode('ascii'), 'utf8_text': text})
          (evidence / 'sdk-legal.json').write_text(json.dumps(legal, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          if Path('Cargo.lock').read_bytes() != (evidence / 'Cargo.lock').read_bytes():
              raise SystemExit('candidate changed the reviewed Cargo lock')
          result = {'target': os.environ['CABI_TARGET'], 'binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(), 'map_sha256': hashlib.sha256(link_map.read_bytes()).hexdigest(), 'machine': int(os.environ['CABI_MACHINE']), 'imports': imports, 'exports': [name.decode('ascii') for name in exports], 'sdk_legal_files': len(legal), 'coverage': 'Actual PE/input identity; source-bound runtime/resource verification is recorded separately in native-runtime-verification.json.'}
          (evidence / 'native-verification.json').write_text(json.dumps(result, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          subprocess.run([sys.executable, '-I', 'scripts/cabi_gnullvm_notices.py', 'verify', str(evidence), str(binary), os.environ['CABI_TARGET']], check=True)
      - name: Load the actual x64 C ABI with SDK paths removed
        if: matrix.target == 'x86_64-pc-windows-gnullvm'
        shell: python
        run: |
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path
          evidence = Path(os.environ['RUNNER_TEMP']) / 'cabi-gnullvm-evidence'
          probe = Path(os.environ['RUNNER_TEMP']) / 'cabi-gnullvm-clean-path'
          probe.mkdir()
          binary = probe / 'ktav_cabi.dll'
          shutil.copyfile(evidence / binary.name, binary)
          windows = Path(os.environ['SystemRoot'])
          environment = {**os.environ, 'PATH': str(windows / 'System32') + os.pathsep + str(windows)}
          script = 'import ctypes; library=ctypes.CDLL("./ktav_cabi.dll"); [getattr(library,name) for name in ["ktav_version","ktav_loads","ktav_free"]]; print("C ABI library loaded and exports resolved")'
          result = subprocess.run([sys.executable, '-I', '-c', script], cwd=probe, env=environment, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=30)
          (evidence / 'loader-stdout.txt').write_bytes(result.stdout)
          (evidence / 'loader-stderr.txt').write_bytes(result.stderr)
          if result.returncode != 0:
              raise SystemExit('actual C ABI library failed to load with SDK paths removed')
          record = {'sdk_path_removed': True, 'only_own_dll_staged': True, 'exit_code': result.returncode, 'binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(), 'scope': 'Matching-x64 DLL loader/export probe only; no Bun/Deno or parser-corpus claim. ARM DLL not executed.'}
          (evidence / 'loader-probe.json').write_text(json.dumps(record, sort_keys=True, indent=2) + '\n', encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: go-cabi-gnu-candidate-${{ matrix.target }}
          path: ${{ runner.temp }}/cabi-gnullvm-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: go-cabi-gnu-diagnostics-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/cabi-gnullvm-evidence/*.json
            ${{ runner.temp }}/cabi-gnullvm-evidence/*.txt
            ${{ runner.temp }}/cabi-gnullvm-evidence/*.map
            ${{ runner.temp }}/cabi-gnullvm-evidence/*.lock
          if-no-files-found: warn

  go-consumers:
    name: Genuine Go GNU consumer / ${{ matrix.arch }}
    needs: cabi-gnullvm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            go-arch: amd64
            target: x86_64-pc-windows-gnullvm
          - os: windows-11-arm
            arch: arm64
            go-arch: arm64
            target: aarch64-pc-windows-gnullvm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          architecture: ${{ matrix.go-arch }}
      - uses: actions/download-artifact@v4
        with:
          name: go-cabi-gnu-candidate-${{ matrix.target }}
          path: ${{ runner.temp }}/go-gnu-delivered
      - name: Run unchanged original Go native and pure tests without Rust or SDK
        shell: python
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_GO_ARCH: ${{ matrix.go-arch }}
          EXPECTED_TARGET: ${{ matrix.target }}
          ACTUAL_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          if os.environ['ACTUAL_RUNNER_ARCH'].lower() != os.environ['EXPECTED_ARCH']:
              raise SystemExit('genuine matching-CPU Go runner required')
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != os.environ['SOURCE_REF']:
              raise SystemExit('unexpected original Go consumer source')
          delivered = Path(os.environ['RUNNER_TEMP']) / 'go-gnu-delivered'
          raw = (delivered / 'ktav_cabi.dll').read_bytes()
          checksum = hashlib.sha256(raw).hexdigest()
          identity = json.loads((delivered / 'native-verification.json').read_bytes())
          runtime = json.loads((delivered / 'native-runtime-verification.json').read_bytes())
          if identity['target'] != os.environ['EXPECTED_TARGET'] or identity['binary_sha256'] != checksum or runtime['binary_sha256'] != checksum:
              raise SystemExit('actual Go consumer and verified GNU producer differ')
          if Path('target').exists():
              raise SystemExit('Go consumer must start without a Rust/native build tree')
          binary = Path('target/release/ktav_cabi.dll')
          binary.parent.mkdir(parents=True)
          binary.write_bytes(raw)
          environment = dict(os.environ)
          for name in ['KTAV_LIB_PATH', 'CARGO_TARGET_DIR', 'KTAV_FORCE_PURE', 'GOOS', 'GOARCH']:
              environment.pop(name, None)
          key = next(name for name in environment if name.upper() == 'PATH')
          environment[key] = os.pathsep.join(part for part in environment[key].split(os.pathsep) if part and not any(token in part.lower() for token in ['.cargo', '.rustup', 'llvm-mingw']))
          environment['CGO_ENABLED'] = '0'
          actual = json.loads(subprocess.check_output(['go', 'env', '-json', 'GOOS', 'GOARCH', 'CGO_ENABLED'], env=environment))
          if actual != {'GOOS': 'windows', 'GOARCH': os.environ['EXPECTED_GO_ARCH'], 'CGO_ENABLED': '0'}:
              raise SystemExit('actual Go runtime target/architecture differs')
          result = subprocess.run(['go', 'test', '-json', '-count=1', './...'], env=environment, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=1500)
          (delivered / 'consumer-stdout.jsonl').write_bytes(result.stdout)
          (delivered / 'consumer-stderr.txt').write_bytes(result.stderr)
          sys.stdout.buffer.write(result.stdout)
          sys.stderr.buffer.write(result.stderr)
          if result.returncode:
              raise SystemExit('original Go tests failed against actual delivered GNU DLL')
          events = [json.loads(line) for line in result.stdout.splitlines() if line.strip()]
          required = {'TestConformanceValid', 'TestConformanceCanonical', 'TestConformanceInvalid', 'TestConformanceUnrepresentable', 'TestConformanceParseableUnrepresentable', 'TestConformanceStrictLossy', 'TestNativeVersionMatchesLibVersion'}
          passed = {item.get('Test') for item in events if item.get('Action') == 'pass'}
          if not required <= passed or any(item.get('Action') == 'skip' and item.get('Test', '').startswith('TestConformance') for item in events):
              raise SystemExit('all original native corpus categories and actual ABI version test must execute')
          if binary.read_bytes() != raw or (delivered / 'ktav_cabi.dll').read_bytes() != raw:
              raise SystemExit('actual native DLL changed during Go consumer execution')
          subprocess.run(['git', 'diff', '--exit-code', '--', 'Cargo.toml', 'crates', 'go.mod', 'go.sum', '*.go', 'internal', 'pure', 'tests', 'root-docs', 'spec'], check=True)
          report = {'source_ref': os.environ['SOURCE_REF'], 'target': identity['target'], 'runner_arch': os.environ['EXPECTED_ARCH'], 'go_environment': actual, 'go_version': subprocess.check_output(['go', 'version'], env=environment, text=True).strip(), 'binary_sha256': checksum, 'passed_test_events': sum(item.get('Action') == 'pass' and 'Test' in item for item in events), 'native_conformance_test_events': sum(item.get('Action') == 'pass' and item.get('Test', '').startswith('TestConformance') for item in events), 'all_native_categories_passed': sorted(required), 'rust_and_sdk_paths_removed': True, 'scope': 'Original Go source/spec tests against exact genuine GNU candidate, native CPU, no cgo/Rust/SDK. No module-download/native-cache lookup, production integration or historical repair claim.'}
          (delivered / 'consumer-verification.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-gnu-consumer-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/go-gnu-delivered/consumer-verification.json
            ${{ runner.temp }}/go-gnu-delivered/consumer-stdout.jsonl
            ${{ runner.temp }}/go-gnu-delivered/consumer-stderr.txt
          if-no-files-found: warn

  stage-release:
    name: Stage GNU release role / ${{ matrix.target }}
    needs: [cabi-gnullvm, go-consumers]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-gnullvm, aarch64-pc-windows-gnullvm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: go-cabi-gnu-candidate-${{ matrix.target }}
          path: ${{ runner.temp }}/go-gnu-delivered
      - name: Stage exact verified DLL and full notice sidecars
        shell: bash
        run: |
          set -euo pipefail
          python -I scripts/stage_go_gnu_release.py "$RUNNER_TEMP/go-gnu-delivered" "$RUNNER_TEMP/go-gnu-release" '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: native-distribution-${{ matrix.target }}
          path: ${{ runner.temp }}/go-gnu-release/
          if-no-files-found: error


  docs-proposal:
    name: Generate Windows GNU runtime documentation proposal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate and check the reviewed EN RU ZH runtime unit
        shell: python
        run: |
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path
          unit = Path('root-docs/README/runtime-support/body-1.md')
          proposed = Path('ci/fixtures/go-runtime-support.md.txt')
          shutil.copyfile(proposed, unit)
          subprocess.run(['node', 'scripts/build-docs.mjs'], check=True)
          subprocess.run(['node', 'scripts/build-docs.mjs', '--check'], check=True)
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          names = ['README.md', 'docs/README.ru.md', 'docs/README.zh.md']
          if changed != {str(unit), *names}:
              raise SystemExit('documentation proposal changed unrelated files')
          output = Path(os.environ['RUNNER_TEMP']) / 'go-gnu-doc-proposal'
          output.mkdir()
          rows = []
          for name in names:
              raw = Path(name).read_bytes()
              destination = output / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(raw)
              rows.append({'path': name, 'sha256': hashlib.sha256(raw).hexdigest()})
          record = {'tooling_ref': os.environ['GITHUB_SHA'], 'source_unit_sha256': hashlib.sha256(unit.read_bytes()).hexdigest(), 'files': rows}
          (output / 'source-provenance.json').write_text(json.dumps(record, indent=2) + '\n', encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: go-gnu-doc-proposal
          path: ${{ runner.temp }}/go-gnu-doc-proposal/
          if-no-files-found: error
